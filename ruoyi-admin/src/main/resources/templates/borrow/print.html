<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>借阅记录打印</title>
    <style>
        body { font-family: "Microsoft YaHei", Arial, sans-serif; margin: 24px; color: #222; }
        h1 { font-size: 20px; text-align: center; margin: 0 0 6px; }
        .meta { text-align: center; font-size: 12px; color: #555; margin-bottom: 4px; }
        .criteria { text-align: center; font-size: 12px; color: #555; margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { border: 1px solid #666; padding: 6px 8px; text-align: left; }
        th { background: #f2f2f2; }
        .sign { margin-top: 24px; font-size: 12px; display: flex; justify-content: space-between; }
        @media print { body { margin: 8mm; } .no-print { display: none; } }
    </style>
</head>
<body>
<h1>借阅记录清单</h1>
<div class="meta" th:text="'筛选：' + ${criteria}"></div>
<div class="meta" th:text="'操作者：' + ${operator} + '　打印时间：' + ${printedAt} + '　共 ' + ${#lists.size(rows)} + ' 条'"></div>
<table>
    <thead>
    <tr>
        <th>借阅单号</th>
        <th>档号</th>
        <th>档案题名</th>
        <th>申请人</th>
        <th>借期开始</th>
        <th>应归还日</th>
        <th>状态</th>
        <th>逾期</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="row : ${rows}">
        <td th:text="${row.borrowNo}"></td>
        <td th:text="${row.archiveCode}"></td>
        <td th:text="${row.archiveTitle}"></td>
        <td th:text="${row.applicantName}"></td>
        <td th:text="${row.startDate}"></td>
        <td th:text="${row.endDate}"></td>
        <td th:text="${row.statusLabel}"></td>
        <td th:text="${row.overdue} ? '已逾期' : ''"></td>
    </tr>
    </tbody>
</table>
<div class="sign"><span>制表人：</span><span>审核人：</span></div>
<script>window.addEventListener('load', function () { window.print(); });</script>
</body>
</html>
