<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>气象记录打印</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; margin: 24px; color: #222; }
        h2 { text-align: center; margin-bottom: 8px; }
        .meta { text-align: center; color: #666; font-size: 12px; margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { border: 1px solid #999; padding: 6px 8px; text-align: left; }
        th { background: #f2f2f2; }
        .footer { margin-top: 16px; font-size: 12px; color: #666; display: flex; justify-content: space-between; }
        @media print { .no-print { display: none; } body { margin: 8mm; } }
    </style>
</head>
<body>
<h2>气象记录统计表</h2>
<div class="meta">
    筛选条件：城市 <span th:text="${#strings.isEmpty(query.cityCode) ? '全部' : query.cityCode}"></span>
    ｜ 预报时间 <span th:text="${query.dateFrom} ? ' 从 ' + ${query.dateFrom} : ''"></span>
    <span th:text="${query.dateTo} ? ' 至 ' + ${query.dateTo} : ''"></span>
    ｜ 共 <span th:text="${#lists.size(rows)}"></span> 条
</div>
<table>
    <thead>
    <tr>
        <th>城市</th><th>预报时间</th><th>天气</th><th>最低温(℃)</th><th>最高温(℃)</th>
        <th>湿度(%)</th><th>风力</th><th>来源</th><th>采集时间</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="row : ${rows}">
        <td th:text="${row.cityName != null ? row.cityName : row.cityCode}"></td>
        <td th:text="${row.forecastTime}"></td>
        <td th:text="${row.weatherText}"></td>
        <td th:text="${row.tempMin}"></td>
        <td th:text="${row.tempMax}"></td>
        <td th:text="${row.humidity}"></td>
        <td th:text="${row.windLevel}"></td>
        <td th:text="${row.dataSource}"></td>
        <td th:text="${row.collectTime}"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(rows)}"><td colspan="9">没有符合条件的数据</td></tr>
    </tbody>
</table>
<div class="footer">
    <span>操作者：<span th:text="${operator}"></span></span>
    <span>打印时间：<span th:text="${printedAt}"></span></span>
</div>
<div class="no-print" style="margin-top:16px">
    <button onclick="window.print()">打印</button>
</div>
<script>window.addEventListener('load', function () { setTimeout(function () { window.print(); }, 300); });</script>
</body>
</html>
