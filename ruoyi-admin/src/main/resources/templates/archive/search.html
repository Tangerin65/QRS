<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('档案检索')" />
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="search-form">
                <div class="select-list">
                    <ul>
                        <li><label for="archive-keyword">关键词：</label><input id="archive-keyword" name="keyword" maxlength="200" placeholder="档号、题名或摘要"></li>
                        <li><label for="archive-code">档号：</label><input id="archive-code" name="archiveCode" maxlength="80"></li>
                        <li><label for="title">题名：</label><input id="title" name="title" maxlength="200"></li>
                        <li><label for="category">分类：</label><select id="category" name="categoryId">
                            <option value="">全部分类</option>
                            <option th:each="item : ${categories}" th:value="${item.id()}" th:text="${item.path()}"></option>
                        </select></li>
                        <li><label for="secret-level">密级：</label><select id="secret-level" name="secretLevel">
                            <option value="">全部</option>
                            <option th:each="item : ${secretOptions}" th:value="${item.key}" th:text="${item.value}"></option>
                        </select></li>
                        <li><label for="archive-status">状态：</label><select id="archive-status" name="archiveStatus">
                            <option value="">全部</option><option value="DRAFT">草稿</option><option value="SUBMITTED">已提交</option>
                        </select></li>
                        <li><label for="date-from">形成日期：</label><input id="date-from" type="date" name="dateFrom" aria-label="起始日期">
                            至 <input id="date-to" type="date" name="dateTo" aria-label="结束日期"></li>
                        <li>
                            <button class="btn btn-primary btn-rounded btn-sm" type="submit"><i class="fa fa-search"></i> 搜索</button>
                            <button class="btn btn-warning btn-rounded btn-sm" id="reset-search" type="button"><i class="fa fa-refresh"></i> 重置</button>
                        </li>
                    </ul>
                </div>
            </form>
        </div>
        <div class="btn-group-sm" id="toolbar" role="group">
            <button class="btn btn-warning" id="export-search" type="button" shiro:hasPermission="archiveExport">
                <i class="fa fa-download"></i> 导出结果
            </button>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table"></table>
        </div>
    </div>
</div>
<div class="modal fade" id="search-detail" tabindex="-1" role="dialog" aria-labelledby="search-detail-title">
    <div class="modal-dialog" role="document"><div class="modal-content">
        <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal" aria-label="关闭">&times;</button>
            <h4 class="modal-title" id="search-detail-title">档案详情</h4>
        </div>
        <div class="modal-body"><table class="table table-bordered"><tbody id="search-detail-fields"></tbody></table></div>
        <div class="modal-footer"><button class="btn btn-default" data-dismiss="modal" type="button">关闭</button></div>
    </div></div>
</div>
<th:block th:include="include :: footer" />
<script th:inline="javascript">var canViewSearchDetail = /*[[${canView}]]*/ false;</script>
<script th:src="@{/js/archive/search.js}"></script>
</body>
</html>
